name: Build short-drama TV player

on:
  push:
    branches: [main, master]
    tags: ['player-v*']
    paths:
      - 'android-native/**'
      - 'native/**'
      - 'scripts/build_player.py'
      - 'scripts/build_native.py'
      - 'scripts/configure_signing.py'
      - '.github/workflows/player.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - 'native/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Configure Android signing
        run: python scripts/configure_signing.py --project android-native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build player APK
        run: python scripts/build_player.py
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --project android-native --clean
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-native-player
          path: dist/android-native/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish player APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/player-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "短剧TV $TAG" --notes "短剧TV 双端播放器：复用真果鉴站源核心，支持 Android 6 及以上，手机与电视通用。" || true
          gh release upload "$TAG" dist/android-native/* --clobber
